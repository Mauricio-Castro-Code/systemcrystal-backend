name: Respaldo diario de clientes y notas

on:
  schedule:
    - cron: '0 18 * * *'
      timezone: America/Mexico_City
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crystal-daily-backup
  cancel-in-progress: false

jobs:
  backup:
    # Activar tras autorizar Google y configurar la conexión de lectura.
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Generar y guardar respaldo privado en Drive
        env:
          DJANGO_SETTINGS_MODULE: config.backup_settings
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GOOGLE_OAUTH_JSON: ${{ secrets.BACKUP_GOOGLE_OAUTH_JSON }}
          BACKUP_DRIVE_FOLDER_ID: ${{ vars.BACKUP_DRIVE_FOLDER_ID }}
        run: python manage.py backup_to_drive --settings=config.backup_settings
